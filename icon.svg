  <line x1="140" y1="224" x2="230" y2="220" stroke="#C7C0A8" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="248" x2="200" y2="244" stroke="#C7C0A8" stroke-width="3" stroke-linecap="round"/>

  <line x1="282" y1="196" x2="372" y2="200" stroke="#C7C0A8" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="220" x2="372" y2="224" stroke="#C7C0A8" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="244" x2="340" y2="248" stroke="#C7C0A8" stroke-width="3" stroke-linecap="round"/>
</svg>
