<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A5285"/>
      <stop offset="1" stop-color="#1B2B4D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Left page -->
  <path d="M110 168 Q170 138 252 164 V340 Q170 314 110 344 Z"
        fill="#F5F2EA"/>
  <!-- Right page -->
  <path d="M258 164 Q340 138 402 168 V344 Q340 314 258 340 Z"
