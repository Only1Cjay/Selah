  <!-- Center spine shadow -->
  <path d="M252 164 V340" stroke="#D8D2C0" stroke-width="3"/>
  <path d="M258 164 V340" stroke="#D8D2C0" stroke-width="3"/>

  <!-- Bookmark ribbon hanging from top of right page -->
  <path d="M330 172 L330 236 L346 222 L362 236 L362 172 Z"
